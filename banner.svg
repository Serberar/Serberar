<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396" role="img" aria-label="Sergio Bernabé, Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="0.55" stop-color="#0d1830"/><stop offset="1" stop-color="#10243f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#7dd3fc" stroke-opacity="0.055"/></pattern>
  </defs>
  <style>
    .in { opacity: 0; animation: in .8s ease-out forwards }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .4s } .d3 { animation-delay: .65s }
    .ring { transform-origin: 1330px 198px; animation: turn 60s linear infinite }
    .ring.b { animation-duration: 90s; animation-direction: reverse }
    .flow { stroke-dasharray: 5 95; animation: flow 3.6s linear infinite }
    .f2 { animation-delay: -.6s } .f3 { animation-delay: -1.2s } .f4 { animation-delay: -1.8s } .f5 { animation-delay: -2.4s } .f6 { animation-delay: -3s }
    .core { animation: pulse 3.6s ease-in-out infinite }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    @keyframes turn { to { transform: rotate(360deg) } }
    @keyframes flow { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes pulse { 50% { opacity: .55 } }
    @media (prefers-reduced-motion: reduce) { .in, .ring, .flow, .core { animation: none; opacity: 1; transform: none } .flow { opacity: 0 } }
  </style>
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>
  <circle class="core" cx="1330" cy="198" r="250" fill="url(#glow)"/>
  <g fill="none" stroke="#7dd3fc">
    <path class="ring" stroke-opacity="0.2" stroke-width="1.5" d="M1330 48 L1460 123 L1460 273 L1330 348 L1200 273 L1200 123 Z"/>
    <path class="ring b" stroke-opacity="0.12" stroke-width="1.5" d="M1330 -2 L1503 98 L1503 298 L1330 398 L1157 298 L1157 98 Z"/>
    <path stroke-opacity="0.65" stroke-width="2.2" d="M1330 126 L1393 162 L1393 234 L1330 270 L1267 234 L1267 162 Z"/>
    <g stroke-opacity="0.22" stroke-width="1.5"><path d="M1330 126 L1330 48"/><path d="M1393 162 L1460 123"/><path d="M1393 234 L1460 273"/><path d="M1330 270 L1330 348"/><path d="M1267 234 L1200 273"/><path d="M1267 162 L1200 123"/></g>
  </g>
  <g fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"><path class="flow f1" pathLength="100" d="M1330 48 L1330 126"/><path class="flow f2" pathLength="100" d="M1460 123 L1393 162"/><path class="flow f3" pathLength="100" d="M1460 273 L1393 234"/><path class="flow f4" pathLength="100" d="M1330 348 L1330 270"/><path class="flow f5" pathLength="100" d="M1200 273 L1267 234"/><path class="flow f6" pathLength="100" d="M1200 123 L1267 162"/></g>
  <circle class="core" cx="1330" cy="198" r="15" fill="#34d399"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text class="in d1" x="470" y="168" font-size="78" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Sergio Bernabé</text>
    <text class="in d2" x="473" y="222" font-size="32" fill="#cbd5e1">Software Engineer · Backend y DevOps</text>
    <rect x="473" y="248" width="190" height="5" rx="2.5" fill="url(#accent)"/>
    <text class="in d3" x="473" y="298" font-size="22" fill="#8ea3bf" font-family="Consolas, Menlo, monospace">TypeScript / Node.js / React / Docker / Python</text>
  </g>
</svg>
